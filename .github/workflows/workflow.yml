name: Website Deployment
on:
    push:
        branches:
            - main
env:
  AUTHOR: ${{ github.actor }}
jobs:
    lint:
        runs-on: ubuntu-latest
        steps:
            - name: Get code
              uses: actions/checkout@v7
            - name: Set up Node
              uses: actions/setup-node@v7
              with:
                node-version: 22
            - name: Cache Dependencies
              uses: actions/cache@v6
              with:
                path: ~/.npm
                key: deps-node-modules-${{ hashFiles('**/package-lock.json') }}
            - name: Install Dependencies
              run: npm ci
            - name: Lint code
              run: npm run lint:ci
    test:
        needs: lint
        runs-on: ubuntu-latest
        steps:
            - name: Get code
              uses: actions/checkout@v7
            - name: Set up Node
              uses: actions/setup-node@v7
              with:
                node-version: 22
            - name: Cache Dependencies
              uses: actions/cache@v6
              with:
                path: ~/.npm
                key: deps-node-modules-${{ hashFiles('**/package-lock.json') }}
            - name: Install Dependencies
              run: npm ci
            - name: Run tests
              id: run-tests
              run: npm test
            - name: Upload test report
              if: failure() && steps.run-tests.outcome == 'failure'
              uses: actions/upload-artifact@v7
              with:
                name: test-report
                path: test.json
    build:
        needs: test
        runs-on: ubuntu-latest
        steps:
            - name: Get code
              uses: actions/checkout@v7
            - name: Set up Node
              uses: actions/setup-node@v7
              with:
                node-version: 22
            - name: Cache Dependencies
              uses: actions/cache@v6
              with:
                path: ~/.npm
                key: deps-node-modules-${{ hashFiles('**/package-lock.json') }}
            - name: Install Dependencies
              run: npm ci
            - name: Build website
              run: npm run build
            - name: Upload build artifacts
              uses: actions/upload-artifact@v7
              with:
                name: dist-files
                path: dist
                if-no-files-found: error
    deploy:
        needs: build
        runs-on: ubuntu-latest
        steps:
            - name: Get Build Artifacts
              uses: actions/download-artifact@v7
              with:
                name: dist-files
                path: dist
            - name: List dist's contents
              run: ls -la dist
            - name: Deploy to GitHub Pages
              run: echo "Deploying by $AUTHOR..."
