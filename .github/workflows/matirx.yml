name: Matrix Demo
on: workflow_dispatch
jobs:
    build:
        strategy:
            matrix:
                node-version: [18, 20, 22]
                os: [ubuntu-latest, windows-latest, macos-latest]
                exclude:
                    - node-version: 18
                      os: macos-latest
        runs-on: ${{ matrix.os }}
        steps:
            - name: Get code
              uses: actions/checkout@v7
            - name: Set up NodeJS
              uses: actions/setup-node@v7
              with:
                node-version: ${{ matrix.node-version }}
            - name: Install Dependencies
              run: npm ci
            - name: Build project
              run: npm run build